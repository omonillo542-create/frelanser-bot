# GitHub Actions — butunlay bepul 24/7 ishga tushirish (karta talab qilinmaydi)
# Och kerak: PUBLIC repo (ommaviy repo'da daqiqlar cheksiz)
#
# 1. repo'ni GitHub'ga yuklang
# 2. Settings → Secrets and variables → Actions → New repository secret:
#      BOT_TOKEN   -> 88147...:AAE...
#      ADMIN_ID    -> sizning Telegram ID
#      GIST_TOKEN  -> GitHub PAT (gist scope)
# 3. Actions → "Frilans bot" → Run workflow
name: Frilans bot (24/7)

on:
  schedule:
    - cron: "*/5 * * * *"      # har 5 daqiqada — ketma-ket ishlaydi (daqiqlar cheksiz)
  workflow_dispatch: {}        # qo'lda ishga tushirish

# Ikki ishga tushirish bir vaqtda ishlamasin
concurrency:
  group: bot-runner
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Kutubxonalarni o'rnatish
        run: pip install -r requirements.txt

      # GitHub 60 kun repo faoliyati bo'lmasa jadvalni avtomatik O'CHIRADI.
      # Shuning uchun haftada bir marta mayda belgi qoldiramiz (bot ishlashda qoladi).
      - name: Jonlilik belgisi (avtomatik o'chirishdan himoya)
        env:
          TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          last=$(git log -1 --format=%ct -- last_run.txt 2>/dev/null || echo 0)
          now=$(date +%s)
          if [ $((now - last)) -gt 518400 ]; then
            echo "last_run=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > last_run.txt
            git add last_run.txt
            git commit -q -m "chore: jonlilik belgisi" || exit 0
            auth=$(printf "x-access-token:%s" "$TOKEN" | base64 -w0)
            if git -c http.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:main; then
              echo "Jonlilik belgisi yuborildi"
            else
              echo "Push amalga oshmadi — keyingi safar qayta uriniladi"
            fi
          else
            echo "Belgi yaqinda qoldirilgan — skipt"
          fi

      - name: Botni ishga tushirish
        run: python bot/main.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          DB_PATH: bot_data.db
          MAX_RUNTIME_MINUTES: "6"    # 6 daqiqa ishlaydi (keyingisi zaxirada turadi)
          GIST_INTERVAL_MINUTES: "5"
          TZ_OFFSET_HOURS: "5"
